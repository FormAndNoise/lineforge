      <text x="85" y="23" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="500" fill="#F07A2B" text-anchor="middle">NATIVE RUST VPIPE</text>
      
      <rect x="190" width="140" height="36" rx="6" fill="#181818" stroke="#333333" stroke-width="1" />
      <text x="260" y="23" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="500" fill="#A8A49E" text-anchor="middle">SVG / PDF / EPS</text>
      
      <rect x="350" width="130" height="36" rx="6" fill="#181818" stroke="#333333" stroke-width="1" />
      <text x="415" y="23" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="500" fill="#A8A49E" text-anchor="middle">ZERO-DEP CLI</text>
