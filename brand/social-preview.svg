<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect width="1280" height="640" fill="#0B0B0B" />
  <rect x="32" y="32" width="1216" height="576" rx="16" fill="none" stroke="#222222" stroke-width="1" />
  
  <!-- Large Left Symbol -->
  <g transform="translate(140, 200) scale(10)" fill="none" stroke="#F07A2B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3.5" y1="5" x2="14.5" y2="5" />
    <line x1="3.5" y1="5" x2="9" y2="16.5" />
    <line x1="14.5" y1="5" x2="20" y2="16.5" />
    <line x1="9" y1="16.5" x2="20" y2="16.5" />
    <line x1="20" y1="16.5" x2="21.5" y2="20" />
    <circle cx="14.5" cy="5" r="1.1" />
    <circle cx="9" cy="16.5" r="1.1" />
    <circle cx="20" cy="16.5" r="1.1" />
    <circle cx="3.5" cy="5" r="1.3" fill="#F07A2B" stroke="none" />
  </g>

  <!-- Text Hierarchy -->
  <g transform="translate(440, 250)">
    <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="500" fill="#F07A2B" letter-spacing="2px">FORM &amp; NOISE ATELIER</text>
    <text x="0" y="70" font-family="'Space Grotesk', sans-serif" font-size="72" font-weight="700" fill="#F2EEE8" letter-spacing="-2px">Pantograph</text>
    <text x="0" y="130" font-family="'Inter', sans-serif" font-size="22" font-weight="400" fill="#A8A49E">Raster in, clean vectors out. Batch line tracing with zero external dependencies.</text>
    
    <g transform="translate(0, 190)">
